# INT Hyprland session (OS-INT default). Same shortcuts as the Sway session.
# Look (colours, blur, rounding) and keyboard come from int-theme:
source = ~/.config/int/theme/hyprland.conf
source = ~/.config/int/theme/hyprland-keyboard.conf

monitor = , preferred, auto, 1

$mod = SUPER
$term = foot --app-id=int-terminal

# Wallpaper from the active theme (re-run on every reload so int-theme switches it).
exec = pkill -x swaybg; swaybg -m fill -i "$(cat ~/.config/int/theme/wallpaper-path)"

general {
    layout = dwindle
}

decoration {
    shadow {
        enabled = true
        range = 12
        render_power = 3
    }
}

animations {
    enabled = true
    bezier = intEase, 0.22, 1, 0.36, 1
    animation = windows, 1, 5, intEase, popin 85%
    animation = fade, 1, 5, intEase
    animation = workspaces, 1, 5, intEase, slide
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

windowrule = float, class:^(int-dashboard)$
windowrule = size 760 360, class:^(int-dashboard)$
windowrule = center, class:^(int-dashboard)$

bind = $mod, Return, exec, $term
bind = $mod, D, exec, fuzzel
bind = $mod, I, exec, int-dashboard show
bind = $mod, T, exec, $term sh -c 'int-theme list; printf "\n> "; read n; int-theme set "$n"; sleep 2'
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = $mod SHIFT, Space, togglefloating
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod, Left, movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up, movefocus, u
bind = $mod, Down, movefocus, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
# Desktop tools preset (int-apps add desktop-tools); harmless when absent.
exec-once = /usr/libexec/int-desktop-tools startup
bind = , Print, exec, /usr/libexec/int-desktop-tools screenshot
bind = $mod, Print, exec, /usr/libexec/int-desktop-tools screenshot area
bind = $mod, Escape, exec, /usr/libexec/int-desktop-tools lock
bind = , XF86MonBrightnessUp, exec, /usr/libexec/int-desktop-tools brightness up
bind = , XF86MonBrightnessDown, exec, /usr/libexec/int-desktop-tools brightness down
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

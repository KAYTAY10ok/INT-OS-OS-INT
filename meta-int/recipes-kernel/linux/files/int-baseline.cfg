# Keep the effective configuration available for later kernel audits.
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_RANDOMIZE_BASE=y
CONFIG_SECURITY_DMESG_RESTRICT=y
# Native nftables for the default host firewall. Existing foundation kernels
# lacked this subsystem; the different local version identifies the new ABI.
CONFIG_NF_CONNTRACK=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_CT=y
# The test image installs this optional module for isolated packet-path checks.
CONFIG_VETH=m

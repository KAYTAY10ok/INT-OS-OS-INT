# INT Secure Boot kernel variant. NOT referenced by any recipe yet: enabling it
# also needs the module-key hygiene described in
# docs/development/secure-boot.md (the build-generated module signing key must
# not reach sstate, kernel-devsrc or deploy).
#
# The kernel must be a PE image so shim/GRUB can verify its signature.
CONFIG_EFI=y
CONFIG_EFI_STUB=y
# Modules are signed during the kernel build with a one-off key whose
# certificate is built into this kernel; unsigned modules are refused.
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_FORCE=y
CONFIG_MODULE_SIG_ALL=y
CONFIG_MODULE_SIG_SHA512=y
CONFIG_MODULE_SIG_KEY="certs/signing_key.pem"
CONFIG_SYSTEM_TRUSTED_KEYRING=y
# Lockdown (integrity): no unsigned kexec, /dev/mem writes, hibernation
# images, etc. Early so it is active before other LSMs.
CONFIG_SECURITY=y
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
CONFIG_LOCK_DOWN_KERNEL_FORCE_INTEGRITY=y
CONFIG_KEXEC_SIG=y
CONFIG_KEXEC_SIG_FORCE=y
# Import firmware db and shim MOK certificates into the platform keyring
# (used for kexec verification, not for modules).
CONFIG_INTEGRITY=y
CONFIG_INTEGRITY_PLATFORM_KEYRING=y
CONFIG_LOAD_UEFI_KEYS=y

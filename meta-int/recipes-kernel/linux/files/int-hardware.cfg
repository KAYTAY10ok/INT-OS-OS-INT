# Common Intel/AMD laptop and desktop hardware for the live/installer ISO.
# Modules load on demand; firmware comes from linux-firmware packages.

# Display: Intel and AMD GPUs, plus a firmware framebuffer fallback.
CONFIG_DRM=y
CONFIG_DRM_I915=m
CONFIG_DRM_AMDGPU=m
CONFIG_DRM_AMDGPU_SI=y
CONFIG_DRM_AMDGPU_CIK=y
CONFIG_DRM_AMD_DC=y
CONFIG_DRM_RADEON=m
CONFIG_DRM_SIMPLEDRM=y
CONFIG_SYSFB_SIMPLEFB=y
CONFIG_FB_EFI=y
CONFIG_ACPI_VIDEO=m
CONFIG_BACKLIGHT_CLASS_DEVICE=y

# Storage and live media.
CONFIG_BLK_DEV_NVME=y
CONFIG_SATA_AHCI=y
CONFIG_ATA_PIIX=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_STORAGE=y
CONFIG_USB_UAS=m
CONFIG_MMC=m
CONFIG_MMC_SDHCI=m
CONFIG_MMC_SDHCI_PCI=m
CONFIG_MMC_BLOCK=m
CONFIG_ISO9660_FS=y
CONFIG_JOLIET=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZSTD=y
CONFIG_OVERLAY_FS=y
CONFIG_BLK_DEV_LOOP=y
CONFIG_VFAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_EFIVAR_FS=y

# Wired network.
CONFIG_E1000E=m
CONFIG_IGB=m
CONFIG_IGC=m
CONFIG_R8169=m
CONFIG_ATL1C=m
CONFIG_ALX=m
CONFIG_TIGON3=m
CONFIG_USB_USBNET=m
CONFIG_USB_NET_CDCETHER=m
CONFIG_USB_RTL8152=m

# Wireless: Intel, Realtek, MediaTek, Atheros/Qualcomm.
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_RFKILL=y
CONFIG_IWLWIFI=m
CONFIG_IWLMVM=m
CONFIG_IWLDVM=m
CONFIG_RTW88=m
CONFIG_RTW88_8822CE=m
CONFIG_RTW88_8821CE=m
CONFIG_RTW89=m
CONFIG_RTW89_8852AE=m
CONFIG_RTW89_8852CE=m
CONFIG_MT7921E=m
CONFIG_ATH10K=m
CONFIG_ATH10K_PCI=m
CONFIG_ATH11K=m
CONFIG_ATH11K_PCI=m
CONFIG_ATH9K=m

# Bluetooth over USB.
CONFIG_BT=y
CONFIG_BT_HCIBTUSB=m

# Input: laptop keyboards, touchpads and multitouch.
CONFIG_HID_GENERIC=y
CONFIG_USB_HID=y
CONFIG_HID_MULTITOUCH=m
CONFIG_I2C_HID_ACPI=m
CONFIG_KEYBOARD_ATKBD=y
CONFIG_MOUSE_PS2=y
CONFIG_MOUSE_ELAN_I2C=m
CONFIG_PINCTRL_INTEL=y
CONFIG_PINCTRL_TIGERLAKE=y
CONFIG_PINCTRL_ALDERLAKE=y
CONFIG_PINCTRL_AMD=y
CONFIG_MFD_INTEL_LPSS_PCI=m
CONFIG_I2C_DESIGNWARE_PLATFORM=m
CONFIG_I2C_I801=m
CONFIG_I2C_PIIX4=m

# Laptop power and sensors.
CONFIG_ACPI_BATTERY=y
CONFIG_ACPI_AC=y
CONFIG_ACPI_BUTTON=y
CONFIG_ACPI_THERMAL=y
CONFIG_CPU_FREQ=y
CONFIG_X86_INTEL_PSTATE=y
CONFIG_X86_AMD_PSTATE=y
CONFIG_SENSORS_CORETEMP=m
CONFIG_SENSORS_K10TEMP=m

# Sound (HDA codecs; SOF for recent Intel laptops is a later release).
CONFIG_SND_HDA_INTEL=m
CONFIG_SND_HDA_CODEC_REALTEK=m
CONFIG_SND_HDA_CODEC_HDMI=m
CONFIG_SND_USB_AUDIO=m

# Encrypted installs (LUKS2): built in so the unlock initramfs needs no modules.
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_CRYPT=y
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_AES_NI_INTEL=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y

# OS-INT hardening: Yama restricts ptrace (kernel.yama.ptrace_scope).
CONFIG_SECURITY_YAMA=y

DISTRO = "int-linux"
DISTRO_NAME = "INT Linux"
DISTRO_VERSION = "0.1.0-dev"
DISTRO_CODENAME = "foundation"
TARGET_VENDOR = "-int"
TCLIBC = "glibc"
INIT_MANAGER = "systemd"
PACKAGE_CLASSES = "package_rpm"
# Curated foundation; desktop features arrive with the shared desktop layer.
DISTRO_FEATURES = "acl ext2 ipv4 ipv6 ldconfig pam pci seccomp systemd usrmerge xattr"
DISTRO_FEATURES_DEFAULTS = ""
PREFERRED_VERSION_linux-yocto = "6.18%"
IMAGE_FSTYPES = "ext4 tar.zst"
IMAGE_LINGUAS = ""
# Exercise the conservative target in emulation as well as at compile time.
QB_CPU:x86-64 = "-cpu qemu64 -machine q35,i8042=off"
QB_SMP = "-smp 2"

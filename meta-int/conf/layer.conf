BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "int"
BBFILE_PATTERN_int = "^${LAYERDIR}/"
BBFILE_PRIORITY_int = "6"
LAYERSERIES_COMPAT_int = "wrynose"
LAYERDEPENDS_int = "core networking-layer"
# Recipes that need meta-browser/meta-firefox (browser profile only). Other
# profiles never parse them, so they do not need the Firefox layer.
BBFILES_DYNAMIC += "firefox-browser-layer:${LAYERDIR}/dynamic-layers/firefox-browser-layer/recipes-*/*/*.bb"

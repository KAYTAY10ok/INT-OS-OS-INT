[Unit]
# A missing policy must fail loading, not skip the service's start condition.
ConditionPathExists=

[Service]
# Upstream starts/reloads/stops by flushing ALL tables. INT owns only int_filter.
ExecStart=
ExecStart=@SBINDIR@/nft -f @SYSCONFDIR@/nftables/rules/main.nft
ExecReload=
ExecReload=@SBINDIR@/nft -f @SYSCONFDIR@/nftables/rules/main.nft
# A service stop must not silently remove the active firewall.
ExecStop=

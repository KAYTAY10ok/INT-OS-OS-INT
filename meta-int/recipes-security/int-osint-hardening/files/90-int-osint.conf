# INT OS-INT kernel and network hardening, applied by systemd-sysctl at boot.
# Vendor defaults: override a value in /etc/sysctl.d/90-int-osint.conf.

# Hide kernel pointers and the kernel log from unprivileged users.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Only processes' own descendants may be ptraced (Yama). The pinned kernel
# configuration does not enable CONFIG_SECURITY_YAMA yet; the leading "-"
# makes systemd-sysctl skip the key silently until it does.
-kernel.yama.ptrace_scope = 1

# Strict reverse-path filtering (drop spoofed source addresses).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.*.rp_filter = 1

# Never follow or send ICMP redirects.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.*.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.*.send_redirects = 0

# SYN flood protection.
net.ipv4.tcp_syncookies = 1
